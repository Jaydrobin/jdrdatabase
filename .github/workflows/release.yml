name: release
run-name: release ${{ inputs.version || github.ref_name }}

# 릴리스 빌드. 검사·빌드·검증을 거친 브라우저 산출물 dist/jdrdatabase.html과 세 OS의 타우리 데스크톱 설치본
# (Windows .msi·설치 프로그램 .exe·포터블 jdrdatabase-desktop.exe, Linux .deb·.AppImage·.rpm, macOS .dmg)을
# 한 GitHub 릴리스에 첨부하고, 첨부 파일 전부의 SHA-256을 SHA256SUMS에 적는다.
# 두 가지로 시작한다: `v*` 태그 푸시, 또는 Actions 탭의 "Run workflow"(버전을 입력하면 실행한 커밋에 `v<버전>` 태그를
# 만들어 릴리스한다). dist/는 저장소에 커밋하지 않고 릴리스에서만 배포한다(CLAUDE.md 7.1·8장).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 버전(예: 1.2.0, 1.2.0-rc.1). 앞의 v는 붙여도 되고 빼도 된다. 실행한 커밋에 v<버전> 태그를 만든다'
        required: true
        type: string

# 같은 버전의 릴리스가 겹쳐 돌면 자산 업로드가 섞이므로 차례로 돌린다. 릴리스 실행은 취소하지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 버전과 태그를 한 곳에서 정한다. 입력값은 셸에 직접 끼우지 않고 환경 변수로만 넘긴다(스크립트 주입 방지).
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      bundle_version: ${{ steps.version.outputs.bundle_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            raw="$INPUT_VERSION"
          else
            raw="$GITHUB_REF_NAME"
          fi
          raw="$(printf '%s' "$raw" | tr -d '[:space:]')"
          version="${raw#v}"
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::버전 '$raw'이 X.Y.Z 또는 X.Y.Z-<프리릴리스> 형식이 아니다"
            exit 1
          fi
          # 설치본에는 숫자 부분(X.Y.Z)만 넣는다. Windows MSI(WiX)는 프리릴리스 꼬리표를 받지 않고
          # 각 자리의 상한이 255.255.65535다.
          bundle_version="${version%%-*}"
          IFS=. read -r major minor patch <<< "$bundle_version"
          if [ "$major" -gt 255 ] || [ "$minor" -gt 255 ] || [ "$patch" -gt 65535 ]; then
            echo "::error::버전 $bundle_version이 MSI 상한(255.255.65535)을 넘는다"
            exit 1
          fi
          if [ "$version" = "$bundle_version" ]; then prerelease=false; else prerelease=true; fi
          tag="v$version"
          # 수동 실행은 실행한 커밋에 태그를 새로 만든다. 같은 이름의 태그가 다른 커밋을 가리키면 덮어쓰지 않는다.
          # 같은 커밋이면 실패한 릴리스를 다시 돌리는 경우이므로 계속한다.
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] && existing="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::태그 $tag가 이미 다른 커밋($existing)을 가리킨다. 다른 버전을 입력한다"
              exit 1
            fi
            echo "태그 $tag가 이미 이 커밋을 가리킨다. 같은 릴리스에 다시 첨부한다"
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "bundle_version=$bundle_version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$tag version=$version bundle_version=$bundle_version prerelease=$prerelease commit=$GITHUB_SHA"

  # 브라우저 산출물: 검사·빌드·검증·E2E를 거친 단일 HTML.
  web:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Check (lint + typecheck + unit)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify artifact
        run: npm run verify

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: dist/jdrdatabase.html
          if-no-files-found: error

  # 데스크톱 설치본: 세 OS에서 러스트 테스트와 실제 rusqlite 엔진 적합성 테스트를 거친 뒤 릴리스 번들을 만든다.
  # 데스크톱 E2E(tauri-driver)는 desktop.yml이 PR과 main 푸시에서 돌린다.
  desktop:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux dependencies (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install
        run: npm ci

      # 러스트 테스트보다 먼저 돈다: `tauri::generate_context!()`가 컴파일 시점에 `frontendDist`(../dist/tauri)를 읽는다.
      - name: Build browser artifacts
        run: npm run build

      - name: Verify artifact
        run: npm run verify

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

      - name: Native engine contract (JS ↔ rusqlite)
        run: npm run test:native

      # 릴리스 버전을 설치본에 넣는다. 저장소의 tauri.conf.json은 고치지 않고 빌드 때만 `version`을 덮어쓴다.
      - name: Tauri bundle (release)
        shell: bash
        working-directory: src-tauri
        env:
          BUNDLE_VERSION: ${{ needs.prepare.outputs.bundle_version }}
        run: |
          set -euo pipefail
          conf="$RUNNER_TEMP/release.conf.json"
          printf '{"version":"%s"}\n' "$BUNDLE_VERSION" > "$conf"
          npx tauri build --config "$conf"

      # 올릴 파일만 모은다. 기대한 형식이 하나라도 없으면 cp가 실패해 릴리스를 멈춘다.
      # Windows는 설치본 두 가지(.msi, NSIS 설치 프로그램 .exe)에 더해 설치 없이 실행하는 포터블 실행 파일을 올린다.
      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          out=release-out
          bundle=src-tauri/target/release/bundle
          mkdir -p "$out"
          case "$RUNNER_OS" in
            Linux)
              cp "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage "$bundle"/rpm/*.rpm "$out"/
              ;;
            Windows)
              cp "$bundle"/msi/*.msi "$bundle"/nsis/*.exe "$out"/
              cp src-tauri/target/release/jdrdatabase-desktop.exe "$out"/
              ;;
            macOS)
              cp "$bundle"/dmg/*.dmg "$out"/
              ;;
          esac
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release-out/*
          if-no-files-found: error

  # 네 잡이 모두 성공했을 때만 릴리스를 만든다. 한 OS라도 실패하면 일부만 첨부된 릴리스가 생기지 않는다.
  publish:
    needs: [prepare, web, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          set -euo pipefail
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # 수동 실행이면 태그가 아직 없으므로 실행한 커밋(target_commitish)에 태그를 만든다.
      # 태그 푸시 실행이면 태그가 이미 있어 target_commitish는 쓰이지 않는다.
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: release/*
          generate_release_notes: true
          body: |
            ## 내려받기

            | 파일 | 용도 |
            |---|---|
            | `jdrdatabase.html` | 브라우저용. 설치 없이 파일 하나를 브라우저로 연다 |
            | `*_x64_en-US.msi`, `*_x64-setup.exe` | Windows 설치본(MSI, 설치 프로그램) |
            | `jdrdatabase-desktop.exe` | Windows 포터블 실행 파일. 설치 없이 실행하며 WebView2 런타임이 필요하다(Windows 10·11 기본 포함) |
            | `*.deb`, `*.rpm`, `*.AppImage` | Linux 설치본(Debian·Ubuntu, Fedora·RHEL, 배포판 무관) |
            | `*.dmg` | macOS(Apple Silicon) 설치본 |
            | `SHA256SUMS` | 위 파일 전부의 SHA-256. `sha256sum -c SHA256SUMS --ignore-missing`로 확인한다 |

            데스크톱 설치본은 코드 서명을 하지 않았다. Windows SmartScreen과 macOS Gatekeeper가 처음 실행할 때 경고를 띄운다.
