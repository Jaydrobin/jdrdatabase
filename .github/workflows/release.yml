name: release

on:
  push:
    branches: [main]
    paths:
      - index.html
      - src/**
      - scripts/build.mjs
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build single-file app
        run: node scripts/build.mjs

      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest dist/index.html --repo "$GITHUB_REPOSITORY" --title "latest" --notes "Built from ${GITHUB_SHA}"
