name: ci

# 작업 브랜치에는 늘 PR이 열려 있으므로(CLAUDE.md 8장) `pull_request` 하나로 덮인다. `push`까지 모든
# 브랜치에 걸면 같은 커밋에 워크플로가 두 번 돌아, CI 시간이 두 배가 되고 perf 잡이 독립 시행 두 번이
# 되어 잡음으로 빨강이 날 확률도 두 배가 된다(세션 H 점검 실측). push는 기본 브랜치에만 건다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-build-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Guard committed artifacts
        run: |
          test -z "$(git ls-files dist)" || { echo "dist/ must not be committed"; exit 1; }
          test -z "$(find test/fixtures -type f -size +1M 2>/dev/null)" || { echo "fixtures over 1 MB must not be committed"; exit 1; }

      - name: Check (lint + typecheck + unit)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify artifact
        run: npm run verify

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jdrdatabase-html
          path: |
            dist/jdrdatabase.html
            dist/tauri/index.html
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          if-no-files-found: ignore

  # 성능(Step 10): 30만 행 픽스처를 러너에서 만들어(캐시) 8장 항목을 재고, 절대 예산 대신
  # test/perf/perf-baseline.json(같은 러너의 기준선) 대비 30% 회귀를 실패로 본다(CLAUDE.md 6장).
  # 요약 JSON은 로그와 아티팩트(test-results/perf/summary.json)에 남는다. 기준선 갱신은 그 값을 옮겨 적는다.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache generated fixtures
        uses: actions/cache@v4
        with:
          path: test/fixtures/generated
          key: perf-fixtures-${{ hashFiles('scripts/gen-fixture.mjs', 'test/perf/fixture.js', 'test/perf/import.perf.spec.js', 'test/perf/import-xlsx.perf.spec.js', 'test/perf/memory.perf.spec.js') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Perf (baseline regression check)
        run: npm run test:perf
        env:
          JDR_PERF_COMPARE: '1'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: test-results/perf/
          if-no-files-found: ignore
