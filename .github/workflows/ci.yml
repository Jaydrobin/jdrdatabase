name: ci

# PR 검사. 작업 브랜치에는 늘 PR이 열려 있으므로(CLAUDE.md 8장) `pull_request` 하나로 덮인다. `main`에 들어가는
# 병합 커밋은 PR에서 검사한 내용과 같으므로 `push`에는 걸지 않는다(같은 커밋을 두 번 돌리면 Actions 분량과
# perf 잡의 잡음 빨강 확률이 함께 두 배가 된다). 세 OS 데스크톱 검사는 desktop.yml(수동)과 release.yml이 맡는다.
on:
  pull_request:

# 같은 PR에 새 푸시가 오면 앞선 실행을 취소해 러너 시간을 아낀다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 문서만 바뀐 푸시에서 무거운 잡을 건너뛴다. `paths-ignore`로 워크플로 자체를 막으면 필수 체크가
  # 영영 pending으로 남아 병합이 막히므로, 워크플로는 늘 돌리고 잡 수준 `if`로 건너뛴다(건너뛴 잡은
  # skipped로 보고되어 필수 체크를 만족한다). 서드파티 액션을 쓰지 않고 git diff로만 판정한다.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect non-docs changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          have() { [ -n "$1" ] && [ "$1" != '0000000000000000000000000000000000000000' ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          files=''
          known=0
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            # v1 구현은 PR 하나를 세션마다 이어 푸시하므로(CLAUDE.md 8장) PR 전체 diff에는 늘 코드가
            # 들어 있다. 판정 대상은 "이번 푸시"여야 하므로 synchronize의 before..after를 먼저 본다.
            if have "$BEFORE_SHA" && have "$AFTER_SHA"; then
              files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
              known=1
            # PR을 연 첫 실행에는 before가 없고, force-push 뒤에는 before가 사라진다. 둘 다 PR 전체를 본다.
            elif have "$BASE_SHA" && have "$HEAD_SHA"; then
              files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
              known=1
            fi
          fi
          # 범위를 정할 수 없으면 건너뛰지 않는다.
          if [ "$known" = '0' ]; then
            echo 'diff range unknown -> run everything'
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo '--- changed files ---'
          printf '%s\n' "$files"
          # docs/** 와 README.md 만 남으면 문서 전용. 빈 줄도 같이 지운다.
          rest="$(printf '%s\n' "$files" | grep -Ev '^(docs/.*|README\.md)?$' || true)"
          if [ -n "$rest" ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            echo 'non-docs changes found -> run everything'
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
            echo 'docs-only change -> heavy jobs skipped'
          fi

  check-build-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Guard committed artifacts
        run: |
          test -z "$(git ls-files dist)" || { echo "dist/ must not be committed"; exit 1; }
          test -z "$(find test/fixtures -type f -size +1M 2>/dev/null)" || { echo "fixtures over 1 MB must not be committed"; exit 1; }

      - name: Check (lint + typecheck + unit)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify artifact
        run: npm run verify

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jdrdatabase-html
          path: |
            dist/jdrdatabase.html
            dist/tauri/index.html
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          if-no-files-found: ignore

  # 성능(Step 10): 30만 행 픽스처를 러너에서 만들어(캐시) 8장 항목을 재고, 절대 예산 대신
  # test/perf/perf-baseline.json(같은 러너의 기준선) 대비 30% 회귀를 실패로 본다(CLAUDE.md 6장).
  # 요약 JSON은 로그와 아티팩트(test-results/perf/summary.json)에 남는다. 기준선 갱신은 그 값을 옮겨 적는다.
  perf:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache generated fixtures
        uses: actions/cache@v4
        with:
          path: test/fixtures/generated
          key: perf-fixtures-${{ hashFiles('scripts/gen-fixture.mjs', 'test/perf/fixture.js', 'test/perf/import.perf.spec.js', 'test/perf/import-xlsx.perf.spec.js', 'test/perf/memory.perf.spec.js') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Perf (baseline regression check)
        run: npm run test:perf
        env:
          JDR_PERF_COMPARE: '1'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: test-results/perf/
          if-no-files-found: ignore
