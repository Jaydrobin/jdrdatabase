name: desktop

# 데스크톱(Step 11): 세 플랫폼에서 러스트 워크스페이스 검사(fmt·clippy·test), 실제 rusqlite 엔진에 대한 JS 적합성
# 테스트(test:native), 타우리 빌드. Linux는 tauri-driver(WebKitWebDriver + Xvfb)로 데스크톱 E2E까지 돌린다.
# 브라우저 산출물 검사는 ci.yml이 맡는다. 러스트 빌드가 느리므로 PR과 main 푸시에서만 돈다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            e2e: true
          - os: windows-latest
            e2e: false
          - os: macos-latest
            e2e: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux dependencies (WebKitGTK, WebDriver, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb

      - name: Install
        run: npm ci

      # 러스트 검사보다 먼저 돈다: 앱 크레이트의 `tauri::generate_context!()`가 컴파일 시점에
      # `frontendDist`(../dist/tauri)를 읽으므로, 없으면 clippy·test가 프로크 매크로 패닉으로 죽는다.
      - name: Build browser artifacts
        run: npm run build

      - name: Verify artifact
        run: npm run verify

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

      - name: Native engine contract (JS ↔ rusqlite)
        run: npm run test:native

      - name: Tauri build (debug, no bundle)
        run: npx tauri build --debug --no-bundle
        working-directory: src-tauri

      - name: Install tauri-driver
        if: matrix.e2e
        run: cargo install tauri-driver --locked

      - name: Desktop E2E (tauri-driver + Xvfb)
        if: matrix.e2e
        run: xvfb-run -a -s "-screen 0 1400x900x24" npm run test:desktop
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'

      - name: Tauri bundle (release)
        run: npx tauri build
        working-directory: src-tauri

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: ignore
