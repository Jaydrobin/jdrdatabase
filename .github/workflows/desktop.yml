name: desktop

# 데스크톱 검사(Step 11): 세 플랫폼에서 러스트 워크스페이스 검사(fmt·clippy·test), 실제 rusqlite 엔진에 대한 JS 적합성
# 테스트(test:native), 디버그 타우리 빌드(--no-bundle). Linux(WebKitWebDriver + Xvfb)와 Windows(Edge Driver)는
# tauri-driver로 데스크톱 E2E까지 돌린다. macOS는 tauri-driver가 지원하지 않는다.
# 러스트 빌드가 느리고 Windows·macOS 러너는 Actions 분량을 각각 2배·10배로 차감하므로 자동으로 돌지 않는다.
# 데스크톱 코드를 바꾼 PR에서 Actions 탭의 "Run workflow"로 PR 브랜치를 골라 수동으로 돌린다. 설치본은 만들지 않는다
# (release.yml이 세 OS에서 테스트를 거쳐 만든다). 브라우저 산출물 검사는 ci.yml이 맡는다.
on:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            e2e: true
          - os: windows-latest
            e2e: true
          - os: macos-latest
            e2e: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux dependencies (WebKitGTK, WebDriver, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb

      - name: Install
        run: npm ci

      # 러스트 검사보다 먼저 돈다: 앱 크레이트의 `tauri::generate_context!()`가 컴파일 시점에
      # `frontendDist`(../dist/tauri)를 읽으므로, 없으면 clippy·test가 프로크 매크로 패닉으로 죽는다.
      - name: Build browser artifacts
        run: npm run build

      - name: Verify artifact
        run: npm run verify

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

      - name: Native engine contract (JS ↔ rusqlite)
        run: npm run test:native

      - name: Tauri build (debug, no bundle)
        run: npx tauri build --debug --no-bundle
        working-directory: src-tauri

      - name: Install tauri-driver
        if: matrix.e2e
        run: cargo install tauri-driver --locked

      - name: Desktop E2E (tauri-driver + Xvfb)
        if: matrix.e2e && runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1400x900x24" npm run test:desktop
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'

      # tauri-driver는 Windows에서 msedgedriver를 쓰고, 드라이버는 WebView2 런타임과 버전이 같아야 한다.
      # 러너에 미리 깔린 드라이버는 Edge 브라우저 버전을 따르므로 런타임 버전의 드라이버를 먼저 받는다.
      - name: Edge Driver matching the WebView2 runtime (Windows)
        if: matrix.e2e && runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          Write-Host "WebView2 runtime: $version"
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $driver = $null
          if ($version) {
            try {
              Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile (Join-Path $dir 'edgedriver.zip')
              Expand-Archive (Join-Path $dir 'edgedriver.zip') -DestinationPath $dir -Force
              $driver = Join-Path $dir 'msedgedriver.exe'
            } catch {
              Write-Host "download failed: $($_.Exception.Message)"
            }
          }
          if (-not $driver -or -not (Test-Path $driver)) {
            $driver = Join-Path $env:EdgeWebDriver 'msedgedriver.exe'
            Write-Host "falling back to the runner's Edge Driver"
          }
          & $driver --version
          "JDR_NATIVE_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Desktop E2E (tauri-driver + Edge Driver)
        if: matrix.e2e && runner.os == 'Windows'
        run: npm run test:desktop

      # Windows E2E가 실패하면 원인을 가르는 정보를 남긴다. 남은 앱·WebView2 프로세스를 먼저 정리하고(single-instance가
      # 새 실행을 앞 인스턴스로 넘기면 진단이 흐려진다), tauri-driver와 같은 capability로 Edge Driver에 직접 세션을
      # 요청해 드라이버의 상세 로그(앱을 띄운 방법과 기다린 파일)와 WebView2 프로세스가 실제로 받은 명령줄을 찍는다.
      - name: Windows app diagnostics (on E2E failure)
        if: failure() && matrix.e2e && runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = (Resolve-Path 'src-tauri\target\debug\jdrdatabase-desktop.exe' -ErrorAction SilentlyContinue).Path
          if (-not $app) { Write-Host 'no debug binary'; exit 0 }
          Get-Process | Where-Object { $_.ProcessName -match 'jdrdatabase|msedgewebview2|msedgedriver|tauri-driver' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $driver = if ($env:JDR_NATIVE_DRIVER) { $env:JDR_NATIVE_DRIVER } else { Join-Path $env:EdgeWebDriver 'msedgedriver.exe' }
          $log = Join-Path $env:RUNNER_TEMP 'msedgedriver.log'
          $d = Start-Process -FilePath $driver -ArgumentList '--port=9515', '--verbose', "--log-path=$log" -PassThru
          Start-Sleep -Seconds 2
          $caps = @{ capabilities = @{ alwaysMatch = @{ browserName = 'webview2'; 'ms:edgeOptions' = @{ binary = $app; args = @() } } } } | ConvertTo-Json -Depth 6
          try {
            $r = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:9515/session' -Body $caps -ContentType 'application/json' -TimeoutSec 90
            Write-Host "session created: $($r.value.sessionId)"
          } catch {
            Write-Host "session failed: $($_.Exception.Message)"
            if ($_.ErrorDetails) { Write-Host $_.ErrorDetails.Message }
          }
          Write-Host '--- WebView2 / app processes and command lines ---'
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'jdrdatabase|msedgewebview2' } | ForEach-Object { Write-Host "$($_.ProcessId) $($_.Name): $($_.CommandLine)" }
          Write-Host '--- msedgedriver log (launch, environment, DevTools) ---'
          Get-Content $log -ErrorAction SilentlyContinue | Select-String -Pattern 'Launching|WEBVIEW2|user-data-dir|remote-debugging|DevToolsActivePort|environment|binary|Failed|ERROR' | Select-Object -First 80 | ForEach-Object { Write-Host $_.Line }
          Stop-Process -Id $d.Id -Force -ErrorAction SilentlyContinue
          Get-Process | Where-Object { $_.ProcessName -match 'jdrdatabase|msedgewebview2' } | Stop-Process -Force -ErrorAction SilentlyContinue
