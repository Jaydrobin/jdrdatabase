[package]
name = "jdrdatabase-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "jdrdatabase 타우리 데스크톱 셸: 네이티브 SQLite 엔진(jdr-core)을 IPC로 노출한다"
license = "MIT"
publish = false

[workspace]
members = ["core"]
default-members = [".", "core"]

[lib]
name = "jdrdatabase_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jdr-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
